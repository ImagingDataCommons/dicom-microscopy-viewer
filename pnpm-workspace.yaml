packages:
  - .

shamefullyHoist: true
strictPeerDependencies: false

allowBuilds:
  core-js: true
  core-js-pure: true
  unrs-resolver: true

overrides:
  # Dependabot high: adm-zip unbounded memory on crafted ZIP
  adm-zip: 0.6.1
  brace-expansion: 1.1.16
  braces: 3.0.3
  # Dependabot high: browserslist RegExp ReDoS
  browserslist: 4.28.7
  # Dependabot high: fast-uri host confusion (backslash authority)
  fast-uri: 3.1.6
  form-data: 3.0.5
  # Dependabot high: js-yaml quadratic merge-key chains
  js-yaml: 3.15.2
  linkify-it: 5.0.2
  minimatch: 3.1.5
  postcss: 8.5.18
  serialize-javascript: 7.0.5
  shell-quote: 1.9.0

minimumReleaseAgeExclude:
  - dicomweb-client@0.11.3
