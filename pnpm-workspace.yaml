packages:
  - .

shamefullyHoist: true
strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  unrs-resolver: true

overrides:
  # Dependabot high: adm-zip unbounded memory on crafted ZIP
  adm-zip: 0.6.1
  # Dependabot high: brace-expansion DoS
  brace-expansion: 1.1.21
  braces: 3.0.3
  # Dependabot high: browserslist RegExp ReDoS
  browserslist: 4.28.7
  # Dependabot high: compression DoS via infinite loop
  compression: 1.8.2
  # Dependabot high: fast-uri authority injection & host confusion (CVE-2026-84292, CVE-2026-84394)
  fast-uri: 3.1.8
  # Dependabot high: follow-redirects leaks credential headers on cross-origin redirects (GHSA-q3jh-wrc6-jgq8, GHSA-8r9p-f939-6h3c)
  follow-redirects: 1.16.1
  form-data: 3.0.5
  # Dependabot high: js-yaml quadratic merge-key chains
  js-yaml: 3.15.2
  # Dependabot high: launch-editor file existence check bypass on Windows (GHSA-587h-7wmj-h5pm)
  launch-editor: 2.14.2
  linkify-it: 5.0.2
  minimatch: 3.1.5
  # Dependabot high: markdown-it quadratic-time smartquotes and link reference parsing (GHSA-r7fv-28h4-cvq7, GHSA-gfr2-rv44-r23c)
  markdown-it: 14.3.3
  # Dependabot high: nanoid generators can loop indefinitely (GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8)
  nanoid@3: 3.3.19
  postcss: 8.5.18
  # Dependabot critical: proxy-addr unbound CPU during request header parsing
  proxy-addr: 2.0.8
  serialize-javascript: 7.0.5
  # Dependabot critical: shell-quote parse() quadratic DoS
  shell-quote: 1.11.0
  # Dependabot high: source-map-js path traversal in sourceRoot
  source-map-js: 1.2.2
  # Dependabot high: webpack-dev-middleware path traversal (GHSA-g84c-rxfj-3j2c; no 5.x patch, dev server 4.x runs on 7.x)
  webpack-dev-middleware: 7.4.6

minimumReleaseAgeExclude:
  - dicomweb-client@0.11.3

patchedDependencies:
  ol@10.9.0: patches/ol@10.9.0.patch
